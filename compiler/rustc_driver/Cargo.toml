[package]
name = "rustc_driver"
version = "0.0.0"
edition = "2024"

[lib]
# Upstream ships both so host rustc can dlopen the dylib and downstream
# rustc_private consumers (clippy-driver, rust_verify, etc.) can link
# against it. wasm32 silently drops the dylib variant — the target has
# no dylib support, so the rlib is what the wasm explorer consumes.
crate-type = ["rlib", "dylib"]

[dependencies]
# tidy-alphabetical-start
rustc_driver_impl = { path = "../rustc_driver_impl" }
# tidy-alphabetical-end

[build-dependencies]
# tidy-alphabetical-start
rustc_windows_rc = { path = "../rustc_windows_rc" }
# tidy-alphabetical-end
