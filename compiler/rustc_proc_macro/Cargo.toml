# verus-explorer shim: instead of building a separate copy of `library/proc_macro`
# (which would give us a TokenStream type nominally distinct from the host
# sysroot's `proc_macro::TokenStream`), this crate re-exports the sysroot
# `proc_macro` directly. Same source, same crate instance, same type identity.
#
# Type identity matters for the proc-macro bridge: clients in
# `verus_builtin_macros` produce `proc_macro::TokenStream`, and rustc's
# expander expects `rustc_proc_macro::TokenStream` — making them aliases lets
# us drop the lossy Display+FromStr round-trip we used to need on the boundary.

[package]
name = "rustc_proc_macro"
version = "0.0.0"
edition = "2024"

[lib]
path = "src/lib.rs"
test = false
doctest = false

[features]
# tidy-alphabetical-start
rustc-dep-of-std = []
# tidy-alphabetical-end
